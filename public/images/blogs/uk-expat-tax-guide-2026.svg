<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgExpat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgExpat)"/>
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="#3730a3" stroke-width="3"/>
  
  <text x="60" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#818cf8" letter-spacing="2">INTERNATIONAL TAX &amp; EXPAT COMPLIANCE</text>
  <text x="60" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff">UK Expat &amp; Non-Resident Tax Guide 2025/2026</text>
  <text x="60" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#c7d2fe">US Expats, Foreign Income, DTAA Treaties &amp; Statutory Residence Test</text>
  
  <g transform="translate(60, 260)">
    <!-- Card 1: SRT Test -->
    <rect x="0" y="0" width="340" height="240" rx="16" fill="#1e1b4b" stroke="#4338ca" stroke-width="2"/>
    <text x="24" y="45" font-family="sans-serif" font-size="20" font-weight="700" fill="#818cf8">Residency Rules</text>
    <text x="24" y="85" font-family="sans-serif" font-size="24" font-weight="800" fill="#ffffff">Statutory Residence Test</text>
    <text x="24" y="125" font-family="sans-serif" font-size="16" fill="#c7d2fe">• 183-Day Automatic Test</text>
    <text x="24" y="155" font-family="sans-serif" font-size="16" fill="#c7d2fe">• Automatic Overseas Test</text>
    <text x="24" y="185" font-family="sans-serif" font-size="16" fill="#c7d2fe">• Sufficient Ties Test</text>

    <!-- Card 2: US Expats -->
    <rect x="370" y="0" width="340" height="240" rx="16" fill="#1e1b4b" stroke="#4338ca" stroke-width="2"/>
    <text x="24" y="45" font-family="sans-serif" font-size="20" font-weight="700" fill="#38bdf8">Cross-Border Taxation</text>
    <text x="24" y="85" font-family="sans-serif" font-size="24" font-weight="800" fill="#ffffff">US Expats &amp; DTAA</text>
    <text x="24" y="125" font-family="sans-serif" font-size="16" fill="#c7d2fe">• US-UK Double Tax Treaty</text>
    <text x="24" y="155" font-family="sans-serif" font-size="16" fill="#c7d2fe">• Foreign Tax Credits (FTC)</text>
    <text x="24" y="185" font-family="sans-serif" font-size="16" fill="#c7d2fe">• US IRA &amp; UK SIPP Rules</text>

    <!-- Card 3: Non-Dom Reforms -->
    <rect x="740" y="0" width="340" height="240" rx="16" fill="#1e1b4b" stroke="#4338ca" stroke-width="2"/>
    <text x="24" y="45" font-family="sans-serif" font-size="20" font-weight="700" fill="#f43f5e">Foreign Income</text>
    <text x="24" y="85" font-family="sans-serif" font-size="24" font-weight="800" fill="#ffffff">Non-Dom &amp; NRL Scheme</text>
    <text x="24" y="125" font-family="sans-serif" font-size="16" fill="#c7d2fe">• 4-Year Residence Relief</text>
    <text x="24" y="155" font-family="sans-serif" font-size="16" fill="#c7d2fe">• Non-Resident Landlord NRL1</text>
    <text x="24" y="185" font-family="sans-serif" font-size="16" fill="#c7d2fe">• Offshore Account Reporting</text>
  </g>

  <rect x="60" y="535" width="1080" height="35" rx="8" fill="#1e1b4b"/>
  <text x="80" y="558" font-family="sans-serif" font-size="14" fill="#a5b4fc">HMRC Expat Guidance • IRS Form 8833 &amp; FBAR • Worldwide Tax Compliance</text>
</svg>
