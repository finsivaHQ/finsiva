<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="#334155" stroke-width="3"/>
  
  <text x="60" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#38bdf8" letter-spacing="2">FINSIVA UK TAX KNOWLEDGE CENTER</text>
  <text x="60" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff">UK Income Tax Rates &amp; Brackets 2025/2026</text>
  <text x="60" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#94a3b8">Personal Allowance, PAYE Deductions &amp; Take-Home Salary Calculator</text>
  
  <!-- Tax Bracket Cards -->
  <g transform="translate(60, 260)">
    <!-- Personal Allowance -->
    <rect x="0" y="0" width="250" height="240" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="0" width="250" height="8" rx="4" fill="#22c55e"/>
    <text x="24" y="50" font-family="sans-serif" font-size="20" font-weight="700" fill="#22c55e">0% Tax Rate</text>
    <text x="24" y="90" font-family="sans-serif" font-size="28" font-weight="800" fill="#ffffff">Personal Allowance</text>
    <text x="24" y="130" font-family="sans-serif" font-size="18" fill="#cbd5e1">Up to £12,570</text>
    <text x="24" y="170" font-family="sans-serif" font-size="14" fill="#94a3b8">Tax-Free Income Band</text>
    <text x="24" y="195" font-family="sans-serif" font-size="13" fill="#64748b">Tapers above £100k</text>

    <!-- Basic Rate -->
    <rect x="275" y="0" width="250" height="240" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="275" y="0" width="250" height="8" rx="4" fill="#3b82f6"/>
    <text x="299" y="50" font-family="sans-serif" font-size="20" font-weight="700" fill="#3b82f6">20% Tax Rate</text>
    <text x="299" y="90" font-family="sans-serif" font-size="28" font-weight="800" fill="#ffffff">Basic Rate</text>
    <text x="299" y="130" font-family="sans-serif" font-size="18" fill="#cbd5e1">£12,571 to £50,270</text>
    <text x="299" y="170" font-family="sans-serif" font-size="14" fill="#94a3b8">Standard Band</text>
    <text x="299" y="195" font-family="sans-serif" font-size="13" fill="#64748b">8% NI applies</text>

    <!-- Higher Rate -->
    <rect x="550" y="0" width="250" height="240" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="550" y="0" width="250" height="8" rx="4" fill="#f59e0b"/>
    <text x="574" y="50" font-family="sans-serif" font-size="20" font-weight="700" fill="#f59e0b">40% Tax Rate</text>
    <text x="574" y="90" font-family="sans-serif" font-size="28" font-weight="800" fill="#ffffff">Higher Rate</text>
    <text x="574" y="130" font-family="sans-serif" font-size="18" fill="#cbd5e1">£50,271 to £125,140</text>
    <text x="574" y="170" font-family="sans-serif" font-size="14" fill="#94a3b8">Upper Band</text>
    <text x="574" y="195" font-family="sans-serif" font-size="13" fill="#64748b">2% NI applies</text>

    <!-- Additional Rate -->
    <rect x="825" y="0" width="250" height="240" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="825" y="0" width="250" height="8" rx="4" fill="#ef4444"/>
    <text x="849" y="50" font-family="sans-serif" font-size="20" font-weight="700" fill="#ef4444">45% Tax Rate</text>
    <text x="849" y="90" font-family="sans-serif" font-size="28" font-weight="800" fill="#ffffff">Additional</text>
    <text x="849" y="130" font-family="sans-serif" font-size="18" fill="#cbd5e1">Over £125,140</text>
    <text x="849" y="170" font-family="sans-serif" font-size="14" fill="#94a3b8">Top Rate Band</text>
    <text x="849" y="195" font-family="sans-serif" font-size="13" fill="#64748b">Zero Personal Allowance</text>
  </g>

  <!-- Footer Tag -->
  <rect x="60" y="535" width="1080" height="35" rx="8" fill="#1e293b"/>
  <text x="80" y="558" font-family="sans-serif" font-size="14" fill="#94a3b8">HMRC PAYE Tax Guidelines • Rest of UK (England, Wales, NI) &amp; Scotland Rates • Verified Tax Data</text>
</svg>
