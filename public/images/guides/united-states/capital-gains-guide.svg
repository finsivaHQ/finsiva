  <rect x="60" y="535" width="1080" height="35" rx="8" fill="#1e293b"/>
  <text x="80" y="558" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748b">IRS Schedule D &amp; Form 8949 • Qualified Dividends &amp; Capital Gains Tax Calculation</text>
</svg>